<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>มีบางอย่างอยากให้เธออ่าน 💌</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #fff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 360px;
      animation: fadeIn 1.2s ease;
      z-index: 2;
    }

    h1 { color: #ff4d88; }
    p { color: #555; }

    button {
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff4d88, #ff85a2);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .hidden { display: none; }

    .heart {
      position: absolute;
      color: #ff4d88;
      animation: floatUp 5s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 0; }
      to { transform: translateY(-800px); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="card" id="page1">
    <h1>มีบางอย่างอยากให้เธออ่าน 💌</h1>
    <button onclick="openLetter()">เปิดจดหมาย</button>
  </div>

  <div class="card hidden" id="page2">
    <h1>ถึงเธอคนพิเศษ ❤️</h1>
    <p>ตั้งแต่วันที่เราเจอกัน ทุกวันมันมีความหมายมากขึ้น</p>
  </div>

  <!-- ตัวเล่น YouTube (ซ่อนไว้) -->
  <div id="player"></div>

  <!-- YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: 'WtcKJtwMD2E', // 🔴 เปลี่ยนเพลงตรงนี้
        playerVars: {
          autoplay: 0,
          loop: 1,
          playlist: 'WtcKJtwMD2E'
        }
      });
    }

    function openLetter() {
      document.getElementById('page1').classList.add('hidden');
      document.getElementById('page2').classList.remove('hidden');

      player.playVideo(); // 🔥 เล่นเพลงหลังจาก user คลิก
      createHearts();
    }

    function createHearts() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.bottom = '-20px';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }, 300);
    }
  </script>

</body>
</html>
