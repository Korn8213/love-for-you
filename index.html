<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Surprise for You ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      overflow: hidden;
    }

    .card {
      background: white;
      width: 320px;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      position: relative;
      animation: fadeIn 1s ease;
    }

    h1 {
      color: #ff4d88;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 15px;
    }

    button {
      background: #ff4d88;
      border: none;
      color: white;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff2f73;
      transform: scale(1.05);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* gallery */
    .gallery {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .gallery img {
      width: 75px;
      height: 75px;
      max-width: 75px;
      max-height: 75px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    img {
      max-width: 100%;
      height: auto;
    }

    /* video */
    .video-box {
      margin-top: 15px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    .video-box iframe {
      width: 100%;
      height: 200px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* hearts */
    .heart {
      position: fixed;
      color: #ff6fa1;
      font-size: 16px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- หน้า 1 -->
  <div class="card page active" id="page1">
    <h1>💖 Surprise 💖</h1>
    <p>มีอะไรบางอย่างอยากให้เธอดู</p>

    <div class="gallery">
      <img src="img1.jpg" />
      <img src="img2.jpg" />
      <img src="img3.jpg" />
    </div>

    <br />
    <button onclick="goPage(2)">กดดูต่อ ➜</button>
  </div>

  <!-- หน้า 2 -->
  <div class="card page" id="page2">
    <h1>🎥 สำหรับเธอ</h1>
    <p>ดูคลิปนี้ให้จบนะ ❤️</p>

    <div class="video-box">
      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID_HERE"
        frameborder="0"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </div>

    <br />
    <button onclick="goPage(1)">ย้อนกลับ</button>
  </div>

  <script>
    function goPage(num) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page' + num).classList.add('active');
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = Math.random() * 10 + 14 + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
