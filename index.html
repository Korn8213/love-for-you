<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>มีบางอย่างอยากให้เธออ่าน 💌</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #fff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 360px;
      animation: fadeIn 1.2s ease;
    }

    h1 { color: #ff4d88; }
    p { color: #555; line-height: 1.7; }

    button {
      margin-top: 20px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff4d88, #ff85a2);
      color: white;
      font-size: 16px;
      cursor: pointer;
      animation: pulse 1.5s infinite;
    }

    .hidden { display: none; }

    /* เอฟเฟกต์หัวใจ */
    .heart {
      position: absolute;
      color: #ff4d88;
      animation: floatUp 5s linear infinite;
    }

    /* ตัวพิมพ์ */
    .typewriter {
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #ff4d88;
      animation: typing 4s steps(40,end), blink .8s infinite;
      margin-bottom: 15px;
    }

    /* ===== ฟิกขนาดรูปตรงนี้ ===== */
    .gallery {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    .gallery img {
      width: 75px;     /* ✅ ขนาดจริง */
      height: 75px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.15);
    }

    /* Animation */
    @keyframes floatUp {
      from { transform: translateY(0); opacity:0; }
      to { transform: translateY(-800px); opacity:1; }
    }

    @keyframes fadeIn {
      from { opacity:0; transform: translateY(20px); }
      to { opacity:1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%{transform:scale(1);}
      50%{transform:scale(1.08);}
      100%{transform:scale(1);}
    }

    @keyframes typing {
      from { width:0; }
      to { width:100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }
  </style>
</head>

<body>

  <!-- หน้าแรก -->
  <div class="card" id="page1">
    <h1>มีบางอย่างอยากให้เธออ่าน 💌</h1>
    <p>กดปุ่มข้างล่างนะ<br>ขอให้อ่านตอนอยู่คนเดียว 😊</p>
    <button onclick="openLetter()">เปิดจดหมาย</button>
  </div>

  <!-- หน้าจดหมาย -->
  <div class="card hidden" id="page2">
    <h1>ถึงเธอคนพิเศษ ❤️</h1>

    <p class="typewriter">
      ตั้งแต่วันที่เราได้เจอกัน ทุกวันมันมีความหมายมากขึ้นจริง ๆ
    </p>

    <div class="gallery">
      <img src="img1.webp" alt="">
      <img src="img2.png" alt="">
      <img src="img3.jpg" alt="">
    </div>

    <button onclick="finalPage()">อ่านต่อ</button>
  </div>

  <!-- หน้าสุดท้าย -->
  <div class="card hidden" id="page3">
    <h1>รักเธอมากนะ 🥰</h1>
    <p>
      และจะรักแบบนี้ไปเรื่อย ๆ<br>
      ขอบคุณที่เป็นรอยยิ้มของเรา 💕
    </p>
  </div>

  <!-- เพลงจาก YouTube -->
  <iframe id="ytmusic" class="hidden"
    width="0" height="0"
    src=""
    frameborder="0"
    allow="autoplay; encrypted-media">
  </iframe>

  <script>
    function openLetter() {
      document.getElementById('page1').classList.add('hidden');
      document.getElementById('page2').classList.remove('hidden');

      const youtubeID = "VIDEO_ID_HERE"; // ใส่ ID เพลง
      document.getElementById('ytmusic').src =
        `https://www.youtube.com/embed/${youtubeID}?autoplay=1&loop=1&playlist=${youtubeID}`;

      createHearts();
    }

    function finalPage() {
      document.getElementById('page2').classList.add('hidden');
      document.getElementById('page3').classList.remove('hidden');
    }

    function createHearts() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.bottom = '-20px';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }, 300);
    }
  </script>

</body>
</html>
